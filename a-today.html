<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="900">
<title>Aldev-Today</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
  :root {
    --bg:#f4f2ee;--surface:#ffffff;--border:#e2dfd8;
    --text-primary:#1a1916;--text-secondary:#6b6860;--text-muted:#a09d98;
    --accent:#2d3546;--busy:#c84b2f;--free:#2e7d5e;--free-bg:#eaf4ef;
    --aldev:#ec2e4a;--aldev-light:#fdeef1;
    --l1:#fbdde2;--l2:#f5aab7;--l3:#ef6f86;--l4:#ec2e4a;
    --warn:#b7791f;--warn-bg:#fdf4e3;
    --radius:6px;--shadow:0 1px 3px rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text-primary);font-size:13px;line-height:1.4;min-height:100vh;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .header-left{display:flex;align-items:center;gap:12px;}
  .subtitle{font-size:12px;color:var(--text-muted);}
  .update-time{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);}

  /* Barre d'outils */
  .toolbar{display:flex;align-items:center;gap:10px 16px;padding:14px 24px 8px;flex-wrap:wrap;}
  .seg{display:flex;border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);}
  .seg button{border:none;background:none;padding:5px 12px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--text-secondary);cursor:pointer;}
  .seg button+button{border-left:1.5px solid var(--border);}
  .seg button.active{background:var(--accent);color:#fff;}
  .nav{display:flex;align-items:center;gap:6px;}
  .nav button{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:4px 10px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text-secondary);cursor:pointer;}
  .nav button:hover:not(:disabled){border-color:var(--accent);color:var(--text-primary);}
  .nav button:disabled{opacity:.35;cursor:default;}
  .nav-title{font-size:15px;font-weight:600;min-width:200px;text-align:center;text-transform:capitalize;}
  .chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary);cursor:pointer;user-select:none;}
  .stale{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:3px 8px;border-radius:3px;}
  .legend{display:flex;gap:8px;align-items:center;margin-left:auto;font-size:11px;color:var(--text-secondary);flex-wrap:wrap;}
  .legend i{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:3px;}

  .main{padding:8px 24px 32px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .msg{padding:40px;text-align:center;color:var(--text-muted);}

  /* ===== Vue semaine ===== */
  table.wk{width:100%;border-collapse:collapse;table-layout:fixed;}
  .wk th{background:#f9f8f6;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;padding:6px 2px;text-align:center;border-left:1px solid var(--border);}
  .wk th.wk-name{text-align:left;padding-left:12px;border-left:none;width:130px;}
  .wk th.wk-day{cursor:pointer;color:var(--text-secondary);border-bottom:1px solid var(--border);}
  .wk th.wk-day:hover{color:var(--text-primary);background:#f0eee9;}
  .wk th.wk-half{font-size:9px;font-weight:500;padding:3px 2px;border-bottom:2px solid var(--border);}
  .wk th.wk-half.pm{border-left:1px dashed var(--border);}
  .wk th.is-today{color:var(--aldev);}
  .wk tr.wk-group td{background:#f9f8f6;padding:4px 12px;font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  .wk td{border-bottom:1px solid #efece6;}
  .wk td.wk-name{padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wk td.wk-cell{height:30px;text-align:center;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;cursor:pointer;border-left:1px solid var(--border);padding:0;}
  .wk td.wk-cell.pm{border-left:1px dashed #e8e4dd;}
  .wk td.wk-cell:hover{outline:2px solid var(--accent);outline-offset:-2px;}
  .wk td.l0{background:var(--free-bg);}
  .wk td.l1{background:var(--l1);color:#8a2333;}
  .wk td.l2{background:var(--l2);color:#6d1626;}
  .wk td.l3{background:var(--l3);color:#fff;}
  .wk td.l4{background:var(--l4);color:#fff;}
  .wk td.past{opacity:.35;}
  .wk td.is-today{box-shadow:inset 0 0 0 1px rgba(236,46,74,.25);}

  .room-name{font-weight:600;font-size:13px;}
  .room-cap{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted);margin-left:4px;font-weight:400;}

  /* ===== Vue jour ===== */
  .row{display:grid;grid-template-columns:130px 200px 1fr;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .row > div{padding:9px 12px;}
  .row .c-st,.row .c-tl{border-left:1px solid var(--border);}
  .row.head{background:#f9f8f6;border-bottom:2px solid var(--border);}
  .row.head > div{padding:8px 12px;font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase;}
  .floor{background:#f9f8f6;padding:4px 12px;font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:3px;}
  .status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;}
  .st-busy{color:var(--busy);background:#fbece8;}
  .st-free{color:var(--free);background:var(--free-bg);}
  .st-off{color:var(--text-muted);background:#f1efeb;}
  .status-sub{font-size:11px;color:var(--text-secondary);margin-top:4px;line-height:1.3;}
  .ticks{position:relative;height:14px;}
  .tick{position:absolute;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted);}
  .tl{position:relative;height:28px;background:#fafaf8;border:1px solid var(--border);border-radius:4px;}
  .hl{position:absolute;top:0;bottom:0;width:1px;background:#ece9e3;}
  .hl.noon{background:#d4cfc8;}
  .pastz{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(0,0,0,.035) 0 4px,transparent 4px 8px);pointer-events:none;}
  .gap{position:absolute;top:3px;bottom:3px;background:var(--free-bg);border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--free);font-size:11px;font-weight:600;opacity:.75;}
  .gap.book{cursor:pointer;}
  .gap span{opacity:0;transition:opacity .15s;}
  .gap.book:hover{background:#d0ece1;opacity:1;}
  .gap.book:hover span{opacity:1;}
  .blk{position:absolute;top:3px;bottom:3px;border-radius:3px;color:#fff;font-size:10px;font-weight:500;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;align-items:center;background:var(--aldev);}
  .blk.office{background:var(--accent);}
  .nowline{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--aldev);pointer-events:none;}
  .nowline::before{content:'';position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--aldev);}
  .evts{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:5px;}
  .evt{font-size:11px;color:var(--text-secondary);}
  .evt b{font-family:'DM Mono',monospace;font-weight:500;color:var(--text-primary);}
  .evt.done{opacity:.5;}

  @media(max-width:760px){
    header,.toolbar,.main{padding-left:12px;padding-right:12px;}
    .nav-title{min-width:0;font-size:14px;}
    .legend{margin-left:0;}
    .wk th.wk-name{width:92px;padding-left:8px;}
    .wk td.wk-name{padding:6px 8px;}
    .wk .room-cap{display:none;}
    .wk td.wk-cell{font-size:10px;}
    .row{grid-template-columns:1fr auto;}
    .row .c-st{border-left:none;text-align:right;}
    .row .c-tl{grid-column:1 / -1;border-left:none;padding-top:0;}
    .row.head{display:none;}
    .tick.odd{display:none;}
  }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <img src="https://raw.githubusercontent.com/DSIAldev/meta/main/11-meta.jpg" alt="Métamorphose" style="height:36px;display:block;">
    <div class="subtitle">SALLES &amp; BUREAUX ALDEV · 4<sup>e</sup> ÉTAGE</div>
  </div>
  <span style="background:var(--aldev);color:#fff;font-size:10px;font-weight:600;padding:3px 10px;border-radius:3px;letter-spacing:.05em;text-transform:uppercase;">ALDEV-TODAY</span>
  <div class="update-time">Mis à jour : <span id="updated">—</span> · par <span style="color:var(--aldev);font-weight:600">Aldev-SI</span></div>
</header>

<div class="toolbar">
  <div class="seg" id="viewSeg">
    <button data-v="week">Semaine</button>
    <button data-v="day">Jour</button>
  </div>
  <div class="nav">
    <button id="prev" title="Précédent">◀</button>
    <div class="nav-title" id="navTitle">—</div>
    <button id="next" title="Suivant">▶</button>
    <button id="todayBtn">Aujourd'hui</button>
  </div>
  <label class="chk"><input type="checkbox" id="showB" checked> Bureaux</label>
  <span class="stale" id="stale" style="display:none"></span>
  <div class="legend" id="legend"></div>
</div>

<div class="main">
  <div class="card" id="board"><div class="msg">Chargement…</div></div>
</div>

<script>
// ---------- Référentiel des salles (le reste de data-aldev.json = bureaux) ----------
const SALLES_INFO = {
  'Bull':        { cap:'10p', email:'bull@angers-developpement.com' },
  'Scania':      { cap:'10p', email:'scania@angers-developpement.com' },
  'Ardoisières': { cap:'7p',  email:'ardoisieres@angers-developpement.com' },
  'Le Cube 7':   { cap:'7p+', email:'lecube7@angers-developpement.com' },
  'Le Cube 6':   { cap:'6p+', email:'lecube6@angers-developpement.com' },
  'Le Cube 4':   { cap:'4p+', email:'lecube4@angers-developpement.com' },
  'Bessonneau':  { cap:'4p',  email:'bessonneau@angers-developpement.com' },
  'Bouvet':      { cap:'4p',  email:'bouvet@angers-developpement.com' },
  'Courant':     { cap:'3p',  email:'courant@angers-developpement.com' },
};
const ORDER = Object.keys(SALLES_INFO);

const H0 = 8*60, H1 = 19*60, SPAN = H1 - H0;     // frise jour 08–19h
const HALVES = [                                  // demi-journées de la vue semaine
  { from: 8*60,     to: 12*60+30, label:'Matin (08h–12h30)',      short:'M' },
  { from: 13*60+30, to: 18*60,    label:'Après-midi (13h30–18h)', short:'A' },
];
const MIN_GAP = 30, STALE_AFTER = 60;

// ---------- Utilitaires ----------
const pct = m => ((m - H0) / SPAN * 100).toFixed(3) + '%';
const hm  = m => { m = Math.round(m); return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); };
const minsOf = d => d.getHours()*60 + d.getMinutes();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isWeekend = d => d.getDay() === 0 || d.getDay() === 6;
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sameDay = (a, b) => a.toDateString() === b.toDateString();
const midnight = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const mondayOf = d => { const x = midnight(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const nextWorkday = d => { const x = midnight(d); do { x.setDate(x.getDate()+1); } while (isWeekend(x)); return x; };
const prevWorkday = d => { const x = midnight(d); do { x.setDate(x.getDate()-1); } while (isWeekend(x)); return x; };

// "Journée entière" = minuit UTC → on recale à minuit local
function localMidnight(iso) { const [y,m,d] = iso.slice(0,10).split('-').map(Number); return new Date(y, m-1, d); }
function spanOf(c) {
  return c.isallday ? { s: localMidnight(c.start), e: localMidnight(c.end) }
                    : { s: new Date(c.start),      e: new Date(c.end) };
}
// Événements touchant le jour, bornés à ce jour (minutes 0–1440), triés
function eventsOfDay(creneaux, day) {
  const d0 = midnight(day), d1 = addDays(d0, 1);
  return (creneaux || [])
    .map(c => ({ c, ...spanOf(c) }))
    .filter(x => x.s < d1 && x.e > d0)
    .map(x => ({ s: x.s <= d0 ? 0 : minsOf(x.s), e: x.e >= d1 ? 1440 : minsOf(x.e), c: x.c }))
    .sort((a,b) => a.s - b.s);
}
// Minutes occupées (chevauchements fusionnés) dans [from, to]
function busyMinutes(evts, from, to) {
  let total = 0, cur = from;
  for (const e of evts) {
    const s = Math.max(e.s, cur), en = Math.min(e.e, to);
    if (en > s) { total += en - s; cur = en; }
  }
  return total;
}
function freeGaps(evts, from) {
  const gaps = []; let cur = from;
  for (const ev of evts) {
    if (ev.e <= cur) continue;
    if (ev.s >= H1) break;
    if (ev.s - cur >= MIN_GAP) gaps.push({ s: cur, e: Math.min(ev.s, H1) });
    cur = Math.max(cur, ev.e);
  }
  if (H1 - cur >= MIN_GAP) gaps.push({ s: cur, e: H1 });
  return gaps;
}

// ---------- État ----------
let DATA = null, ROOMS = [], MAX_DAY = null;
const state = { view: 'day', date: null };
let showB = true;
try { showB = localStorage.getItem('metaAldevBureaux') !== '0'; } catch (e) {}
document.getElementById('showB').checked = showB;

function firstDay() { const t = midnight(new Date()); return isWeekend(t) ? nextWorkday(t) : t; }

function groups() {
  const salles = ROOMS.filter(r => r.isSalle).sort((a,b) => ORDER.indexOf(a.nom) - ORDER.indexOf(b.nom));
  const bureaux = ROOMS.filter(r => !r.isSalle).sort((a,b) => a.nom.localeCompare(b.nom, 'fr'));
  const g = [{ label:'Salles de réunion', rooms: salles }];
  if (showB && bureaux.length) g.push({ label:'Bureaux', rooms: bureaux });
  return g;
}
function nameHTML(r) {
  return `<span class="room-name">${esc(r.nom)}</span>${r.cap ? `<span class="room-cap">${r.cap}</span>` : ''}`;
}

// ---------- Vue semaine ----------
function renderWeek() {
  const mon = mondayOf(state.date);
  const days = [0,1,2,3,4].map(i => addDays(mon, i));
  const now = new Date(), today = midnight(now), nowM = minsOf(now);
  const fri = days[4];
  document.getElementById('navTitle').textContent =
    `Semaine du ${mon.getDate()} ${mon.getMonth() !== fri.getMonth() ? mon.toLocaleDateString('fr-FR',{month:'short'}) + ' ' : ''}au ${fri.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}`;

  let h = '<table class="wk"><thead><tr><th class="wk-name" rowspan="2">Salle / Bureau</th>';
  days.forEach(d => {
    h += `<th colspan="2" class="wk-day${sameDay(d,today)?' is-today':''}" data-day="${ymd(d)}" title="Voir la journée">${d.toLocaleDateString('fr-FR',{weekday:'short'})} ${d.getDate()}</th>`;
  });
  h += '</tr><tr>';
  days.forEach(d => HALVES.forEach((hf,i) => h += `<th class="wk-half${i?' pm':''}${sameDay(d,today)?' is-today':''}">${hf.short}</th>`));
  h += '</tr></thead><tbody>';

  for (const g of groups()) {
    h += `<tr class="wk-group"><td colspan="11">${g.label}</td></tr>`;
    for (const r of g.rooms) {
      h += `<tr><td class="wk-name" title="${esc(r.nom)}">${nameHTML(r)}</td>`;
      for (const d of days) {
        const evts = eventsOfDay(r.créneaux, d);
        HALVES.forEach((hf, i) => {
          const inWin = evts.filter(e => e.s < hf.to && e.e > hf.from);
          const rate = busyMinutes(inWin, hf.from, hf.to) / (hf.to - hf.from);
          const lvl = rate === 0 ? 0 : rate <= .25 ? 1 : rate <= .5 ? 2 : rate < .9 ? 3 : 4;
          const past = d < today || (sameDay(d,today) && nowM >= hf.to);
          const detail = inWin.length
            ? inWin.map(e => `${hm(e.s)}–${hm(e.e)}  ${(e.c.subject || '—').trim()}`).join('\n')
            : 'Libre';
          const tip = `${r.nom} · ${d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric'})} · ${hf.label}\n${detail}`;
          h += `<td class="wk-cell l${lvl}${i?' pm':''}${past?' past':''}${sameDay(d,today)?' is-today':''}" data-day="${ymd(d)}" title="${esc(tip)}">${inWin.length || ''}</td>`;
        });
      }
      h += '</tr>';
    }
  }
  h += '</tbody></table>';
  document.getElementById('board').innerHTML = h;

  document.getElementById('legend').innerHTML =
    '<span><i style="background:var(--free-bg);border:1px solid var(--free)"></i>Libre</span>' +
    '<span><i style="background:var(--l1)"></i>≤25 %</span>' +
    '<span><i style="background:var(--l2)"></i>≤50 %</span>' +
    '<span><i style="background:var(--l3)"></i>&lt;90 %</span>' +
    '<span><i style="background:var(--l4)"></i>Plein</span>' +
    '<span style="color:var(--text-muted)">· chiffre = nb de réunions · clic = détail du jour</span>';

  const minMon = mondayOf(firstDay());
  document.getElementById('prev').disabled = mon <= minMon;
  document.getElementById('next').disabled = !MAX_DAY || addDays(mon, 7) > MAX_DAY;
}

// ---------- Vue jour ----------
function statusHTML(evts, isToday, nowM) {
  if (!isToday) {
    const n = evts.length;
    return n === 0 ? '<span class="status st-free">Libre toute la journée</span>'
                   : `<span class="status st-busy">${n} réservation${n>1?'s':''}</span>`;
  }
  if (nowM >= H1) return '<span class="status st-off">Journée terminée</span>';
  const cur = evts.find(ev => ev.s <= nowM && ev.e > nowM);
  if (cur) {
    let end = cur.e;
    for (const ev of evts) if (ev.s <= end && ev.e > end) end = ev.e;
    return `<span class="status st-busy">Occupé jusqu'à ${end >= 1440 ? 'ce soir' : hm(end)}</span>
            <div class="status-sub">${esc((cur.c.subject || '—').trim())}</div>`;
  }
  const next = evts.find(ev => ev.s > nowM);
  if (!next || next.s >= H1) return '<span class="status st-free">Libre jusqu\'au soir</span>';
  return `<span class="status st-free">Libre jusqu'à ${hm(next.s)}</span>
          <div class="status-sub">puis ${esc((next.c.subject || '—').trim())}</div>`;
}

function timelineHTML(r, evts, isToday, nowM) {
  let h = '<div class="tl">';
  for (let t = H0 + 60; t < H1; t += 60) h += `<div class="hl${t===12*60||t===14*60?' noon':''}" style="left:${pct(t)}"></div>`;
  if (isToday && nowM > H0) h += `<div class="pastz" style="width:${pct(Math.min(nowM, H1))}"></div>`;
  const from = isToday ? Math.max(H0, Math.ceil(nowM / 15) * 15) : H0;
  if (from < H1) {
    for (const g of freeGaps(evts, from)) {
      const book = !!r.email;
      h += `<div class="gap${book?' book':''}" data-room="${esc(r.nom)}" data-s="${g.s}" data-e="${g.e}" style="left:${pct(g.s)};width:${pct(H0 + g.e - g.s)}" title="Libre ${hm(g.s)}–${hm(g.e)}${book?' — cliquer pour réserver':''}">${book?'<span>+</span>':''}</div>`;
    }
  }
  for (const ev of evts) {
    const s = Math.max(ev.s, H0), e = Math.min(ev.e, H1);
    if (e <= s) continue;
    const subj = (ev.c.subject || '—').trim();
    h += `<div class="blk${r.isSalle?'':' office'}" style="left:${pct(s)};width:${pct(H0 + e - s)}" title="${esc(hm(ev.s)+'–'+hm(ev.e)+' · '+subj+' ('+(ev.c.organizer||'?')+')')}">${esc(subj)}</div>`;
  }
  if (isToday && nowM >= H0 && nowM <= H1) h += `<div class="nowline" style="left:${pct(nowM)}"></div>`;
  return h + '</div>';
}

function evtsListHTML(evts, isToday, nowM) {
  if (!evts.length) return '';
  return '<div class="evts">' + evts.map(ev => {
    const when = ev.c.isallday || (ev.s === 0 && ev.e === 1440) ? 'Journée' : `${hm(ev.s)}–${hm(ev.e)}`;
    return `<span class="evt${isToday && ev.e <= nowM ? ' done' : ''}"><b>${when}</b> ${esc((ev.c.subject || '—').trim())}</span>`;
  }).join('') + '</div>';
}

function renderDay() {
  const day = state.date;
  const now = new Date(), nowM = minsOf(now), isToday = sameDay(day, now);
  document.getElementById('navTitle').textContent =
    day.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });

  let ticks = '<div class="ticks">';
  for (let t = H0; t <= H1; t += 60) ticks += `<span class="tick${(t/60)%2 ? ' odd' : ''}" style="left:${pct(t)}">${t/60}h</span>`;
  ticks += '</div>';

  let h = `<div class="row head"><div>Salle / Bureau</div><div class="c-st">${isToday ? 'Maintenant' : 'Synthèse'}</div><div class="c-tl">${ticks}</div></div>`;
  for (const g of groups()) {
    h += `<div class="floor">${g.label}</div>`;
    for (const r of g.rooms) {
      const evts = eventsOfDay(r.créneaux, day);
      h += `<div class="row">
        <div>${nameHTML(r)}</div>
        <div class="c-st">${statusHTML(evts, isToday, nowM)}</div>
        <div class="c-tl">${timelineHTML(r, evts, isToday, nowM)}${evtsListHTML(evts, isToday, nowM)}</div>
      </div>`;
    }
  }
  document.getElementById('board').innerHTML = h;
  document.getElementById('legend').innerHTML =
    '<span><i style="background:var(--free-bg);border:1px solid var(--free)"></i>Libre (salle : clic = réserver)</span>' +
    '<span><i style="background:var(--aldev)"></i>Salle occupée</span>' +
    '<span><i style="background:var(--accent)"></i>Bureau occupé</span>';

  document.getElementById('prev').disabled = day <= firstDay();
  document.getElementById('next').disabled = !MAX_DAY || nextWorkday(day) > MAX_DAY;
}

// ---------- Rendu global ----------
function render() {
  if (!DATA) return;
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('active', b.dataset.v === state.view));
  state.view === 'week' ? renderWeek() : renderDay();
  try { history.replaceState(null, '', '#' + state.view + '/' + ymd(state.date)); } catch (e) {}

  const stale = document.getElementById('stale');
  const m = (DATA.updated || '').match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
  if (m) {
    const age = (new Date() - new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5])) / 60000;
    stale.style.display = age > STALE_AFTER ? '' : 'none';
    stale.textContent = `Données datant de ${age >= 90 ? Math.round(age/60) + ' h' : Math.round(age) + ' min'}`;
  }
}

function reserver(r, day, sMin, eMin) {
  const start = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, sMin);
  const end   = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, eMin);
  const p = new URLSearchParams({
    path:'/calendar/action/compose', rru:'addevent',
    startdt:start.toISOString(), enddt:end.toISOString(),
    subject:`Réunion — ${r.nom}`, location:`${r.nom} — Aldev 4e étage`, to:r.email,
  });
  window.open('https://outlook.office.com/calendar/deeplink/compose?' + p.toString(), '_blank');
}

// ---------- Événements UI ----------
document.getElementById('board').addEventListener('click', e => {
  const dayEl = e.target.closest('[data-day]');
  if (dayEl) { state.view = 'day'; state.date = parseYmd(dayEl.dataset.day); render(); window.scrollTo({top:0}); return; }
  const g = e.target.closest('.gap.book');
  if (g) {
    const r = ROOMS.find(x => x.nom === g.dataset.room); if (!r) return;
    const s = +g.dataset.s, en = +g.dataset.e, rect = g.getBoundingClientRect();
    const clicked = s + (e.clientX - rect.left) / rect.width * (en - s);
    let start = Math.max(s, Math.floor(clicked / 30) * 30);
    if (en - start < 30) start = Math.max(s, en - 30);
    reserver(r, state.date, start, Math.min(start + 60, en));
  }
});
document.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => {
  state.view = b.dataset.v;
  if (state.view === 'day' && state.date < firstDay()) state.date = firstDay();
  if (state.view === 'day' && isWeekend(state.date)) state.date = nextWorkday(state.date);
  render();
});
document.getElementById('prev').onclick = () => {
  state.date = state.view === 'week' ? addDays(mondayOf(state.date), -7) : prevWorkday(state.date);
  if (state.view === 'day' && state.date < firstDay()) state.date = firstDay();
  render();
};
document.getElementById('next').onclick = () => {
  state.date = state.view === 'week' ? addDays(mondayOf(state.date), 7) : nextWorkday(state.date);
  render();
};
document.getElementById('todayBtn').onclick = () => { state.date = firstDay(); render(); };
document.getElementById('showB').onchange = e => {
  showB = e.target.checked;
  try { localStorage.setItem('metaAldevBureaux', showB ? '1' : '0'); } catch (err) {}
  render();
};

// ---------- Chargement ----------
fetch('data-aldev.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('data-aldev.json introuvable'); return r.json(); })
  .then(data => {
    DATA = data;
    document.getElementById('updated').textContent = data.updated || '—';
    ROOMS = (data.salles || []).map(s => {
      const info = SALLES_INFO[s.nom];
      return { nom: s.nom, créneaux: s.créneaux || [], isSalle: !!info, cap: info?.cap || '', email: info?.email || '' };
    });
    // Horizon des données = fin du dernier événement
    let max = 0;
    ROOMS.forEach(r => r.créneaux.forEach(c => { const t = spanOf(c).e.getTime(); if (t > max) max = t; }));
    MAX_DAY = max ? midnight(new Date(max)) : null;

    // État initial : depuis l'URL (#semaine/AAAA-MM-JJ) sinon vue jour
    const hm_ = location.hash.match(/^#(week|day)\/(\d{4}-\d{2}-\d{2})$/);
    if (hm_) { state.view = hm_[1]; state.date = parseYmd(hm_[2]); }
    else {
      const now = new Date();
      state.view = 'day';
      state.date = (minsOf(now) >= H1 || isWeekend(now)) ? nextWorkday(now) : midnight(now);
    }
    if (state.date < firstDay()) state.date = firstDay();
    render();
    setInterval(render, 60000);
  })
  .catch(err => { document.getElementById('board').innerHTML = `<div class="msg">${esc(err.message)}</div>`; });
</script>
</body>
</html>
