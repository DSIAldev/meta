<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="900">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Méta-Today — Aldev</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
  :root {
    --bg:#f4f2ee;--surface:#ffffff;--border:#e2dfd8;
    --text-primary:#1a1916;--text-secondary:#6b6860;--text-muted:#a09d98;
    --accent:#2d3546;--busy:#c84b2f;--free:#2e7d5e;--free-bg:#eaf4ef;
    --aldev:#ec2e4a;--aldev-light:#fdeef1;
    --technopole:#0f1f3d;--technopole-light:#e8eaf0;
    --cci:#373cf5;--cci-light:#eeeffe;
    --other:#4a6741;--other-light:#edf3ec;
    --meta:#68B3E8;--meta-ink:#123a5a;--meta-light:#e3f1fb;
    --warn:#b7791f;--warn-bg:#fdf4e3;
    --radius:6px;--shadow:0 1px 3px rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text-primary);font-size:13px;line-height:1.4;min-height:100vh;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .header-left{display:flex;align-items:center;gap:12px;}
  .subtitle{font-size:12px;color:var(--text-muted);}
  .header-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .update-time{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);}
  .legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary);}
  .legend-dot{width:10px;height:10px;border-radius:2px;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px 8px;flex-wrap:wrap;}
  .day-title{font-size:18px;font-weight:600;text-transform:capitalize;}
  .day-tabs{display:flex;gap:4px;}
  .day-tab{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:5px 12px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--text-secondary);cursor:pointer;}
  .day-tab:hover{border-color:var(--accent);color:var(--text-primary);}
  .day-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .stale{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:3px 8px;border-radius:3px;}

  .main{padding:8px 24px 32px;}
  .board{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .row{display:grid;grid-template-columns:130px 200px 1fr;gap:0;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .row > div{padding:10px 12px;}
  .row .c-tl{border-left:1px solid var(--border);}
  .row .c-st{border-left:1px solid var(--border);}
  .row.head{background:#f9f8f6;border-bottom:2px solid var(--border);}
  .row.head > div{padding:8px 12px;font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase;}
  .floor{background:#f9f8f6;padding:4px 12px;font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);}

  .room-name{font-weight:600;font-size:13px;}
  .room-cap{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted);}

  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:3px;}
  .status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;}
  .st-busy{color:var(--busy);background:#fbece8;}
  .st-free{color:var(--free);background:var(--free-bg);}
  .st-off{color:var(--text-muted);background:#f1efeb;}
  .status-sub{font-size:11px;color:var(--text-secondary);margin-top:4px;line-height:1.3;}

  /* Frise */
  .ticks{position:relative;height:14px;}
  .tick{position:absolute;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted);}
  .tl{position:relative;height:30px;background:#fafaf8;border:1px solid var(--border);border-radius:4px;}
  .hl{position:absolute;top:0;bottom:0;width:1px;background:#ece9e3;}
  .hl.noon{background:#d4cfc8;}
  .past{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(0,0,0,.035) 0 4px,transparent 4px 8px);pointer-events:none;}
  .gap{position:absolute;top:3px;bottom:3px;background:var(--free-bg);border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--free);font-size:11px;font-weight:600;opacity:.75;}
  .gap span{opacity:0;transition:opacity .15s;}
  .gap:hover{background:#d0ece1;opacity:1;}
  .gap:hover span{opacity:1;}
  .blk{position:absolute;top:3px;bottom:3px;border-radius:3px;color:#fff;font-size:10px;font-weight:500;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;align-items:center;}
  .blk.org-aldev{background:var(--aldev);}
  .blk.org-technopole{background:var(--technopole);}
  .blk.org-cci{background:var(--cci);}
  .blk.org-other{background:var(--other);}
  .floor.f-aldev{background:var(--aldev);color:#fff;}
  .floor.f-meta{background:var(--meta);color:var(--meta-ink);}
  .nowline{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--aldev);border-radius:1px;pointer-events:none;}
  .nowline::before{content:'';position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--aldev);}

  .evts{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;}
  .evt{font-size:11px;color:var(--text-secondary);}
  .evt b{font-family:'DM Mono',monospace;font-weight:500;color:var(--text-primary);}
  .evt .org{display:inline-block;font-size:10px;font-weight:500;padding:0 5px;border-radius:3px;margin-left:3px;}
  .org.org-aldev{background:var(--aldev-light);color:var(--aldev);}
  .org.org-technopole{background:var(--technopole-light);color:var(--technopole);}
  .org.org-cci{background:var(--cci-light);color:var(--cci);}
  .org.org-other{background:var(--other-light);color:var(--other);}
  .evt.done{opacity:.5;}

  .msg{padding:40px;text-align:center;color:var(--text-muted);}

  @media(max-width:760px){
    header,.toolbar,.main{padding-left:12px;padding-right:12px;}
    .row{grid-template-columns:1fr auto;}
    .row .c-st{border-left:none;text-align:right;}
    .row .c-tl{grid-column:1 / -1;border-left:none;padding-top:0;}
    .row.head{display:none;}
    .tick.odd{display:none;}
  }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <img src="https://raw.githubusercontent.com/DSIAldev/meta/main/11-meta.jpg" alt="Métamorphose" style="height:36px;display:block;">
    <div class="subtitle">Occupation du jour</div>
  </div>
  <span style="background:var(--aldev);color:#fff;font-size:10px;font-weight:600;padding:3px 10px;border-radius:3px;letter-spacing:.05em;text-transform:uppercase;">MÉTA-TODAY</span>
  <div class="header-right">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--free-bg);border:1px solid var(--free);"></div>Libre — cliquer pour réserver</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--aldev)"></div>Aldev</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--technopole)"></div>Technopôle</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--cci)"></div>CCI</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--other)"></div>Autre</div>
      <div class="legend-item" style="margin-left:6px;color:var(--text-muted)">Bandeau :</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--aldev)"></div>salle Aldev</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--meta)"></div>salle Métamorphose</div>
    </div>
    <div class="update-time">Mis à jour : <span id="updated">—</span> · par <span style="color:var(--aldev);font-weight:600">Aldev-SI</span></div>
  </div>
</header>

<div class="toolbar">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <div class="day-title" id="dayTitle">—</div>
    <span class="stale" id="stale" style="display:none"></span>
  </div>
  <div class="day-tabs">
    <button class="day-tab" id="tab0">Aujourd'hui</button>
    <button class="day-tab" id="tab1">Jour suivant</button>
  </div>
</div>

<div class="main">
  <div class="board" id="board"><div class="msg">Chargement…</div></div>
</div>

<script>
// Salles affichées : Bull et Scania (Aldev, data-aldev.json) puis Métamorphose (data.json).
const SALLES = [
  {nom:'Bull',       etage:'4e étage · Aldev', cap:'10p', bat:'aldev', email:'bull@angers-developpement.com'},
  {nom:'Scania',     etage:'4e étage · Aldev', cap:'10p', bat:'aldev', email:'scania@angers-developpement.com'},
  {nom:'Auditorium', etage:'1er étage', cap:'200p', bat:'meta', email:'auditorium@la-fabrique-angers.fr'},
  {nom:'Le Club',    etage:'1er étage', cap:'20p', bat:'meta',  email:'leclub@la-fabrique-angers.fr'},
  {nom:'Aubance',    etage:'7e étage',  cap:'4p', bat:'meta',   email:'aubance@la-fabrique-angers.fr'},
  {nom:'Authion',    etage:'7e étage',  cap:'10p', bat:'meta',  email:'authion@la-fabrique-angers.fr'},
  {nom:'Layon',      etage:'7e étage',  cap:'4p', bat:'meta',   email:'layon@la-fabrique-angers.fr'},
  {nom:'Loire',      etage:'7e étage',  cap:'19p', bat:'meta',  email:'loire@la-fabrique-angers.fr'},
  {nom:'Louet',      etage:'7e étage',  cap:'4p', bat:'meta',   email:'louet@la-fabrique-angers.fr'},
  {nom:'Maine',      etage:'7e étage',  cap:'18p', bat:'meta',  email:'maine@la-fabrique-angers.fr'},
  {nom:'Mayenne',    etage:'7e étage',  cap:'13p', bat:'meta',  email:'mayenne@la-fabrique-angers.fr'},
  {nom:'Oudon',      etage:'7e étage',  cap:'8p', bat:'meta',   email:'oudon@la-fabrique-angers.fr'},
  {nom:'Sarthe',     etage:'7e étage',  cap:'15p', bat:'meta',  email:'sarthe@la-fabrique-angers.fr'},
];

const H0 = 8*60, H1 = 19*60, SPAN = H1 - H0;   // frise 08:00–19:00
const MIN_GAP = 30;                              // plage libre cliquable mini (min)
const STALE_AFTER = 60;                          // alerte si data.json > 60 min

const ORGS = {
  'angers-developpement.com': { label:'Aldev',      css:'org-aldev' },
  'angerstechnopole.com':     { label:'Technopôle', css:'org-technopole' },
  'maineetloire.cci.fr':      { label:'CCI',        css:'org-cci' }
};
function getOrg(email) {
  if (!email) return { label:'—', css:'org-other' };
  const d = (email.split('@')[1] || '').toLowerCase();
  return ORGS[d] || { label:d, css:'org-other' };
}

const pct = m => ((m - H0) / SPAN * 100).toFixed(3) + '%';
const hm  = m => { m = Math.round(m); return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); };
const minsOf = d => d.getHours()*60 + d.getMinutes();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isWeekend = d => d.getDay() === 0 || d.getDay() === 6;

// Bornes réelles d'un événement. Les "journée entière" arrivent en minuit UTC :
// on prend la date (YYYY-MM-DD) et on la place à minuit local.
function localMidnight(iso) { const [y,m,d] = iso.slice(0,10).split('-').map(Number); return new Date(y, m-1, d); }
function spanOf(c) {
  return c.isallday ? { s: localMidnight(c.start), e: localMidnight(c.end) }
                    : { s: new Date(c.start),      e: new Date(c.end) };
}

// Événements qui touchent le jour donné, bornés à ce jour (minutes 0–1440, sûr au changement d'heure)
function eventsOfDay(creneaux, day) {
  const d0 = new Date(day); d0.setHours(0,0,0,0);
  const d1 = new Date(d0);  d1.setDate(d1.getDate()+1);
  return (creneaux || [])
    .map(c => ({ c, ...spanOf(c) }))
    .filter(x => x.s < d1 && x.e > d0)
    .map(x => ({ s: x.s <= d0 ? 0 : minsOf(x.s), e: x.e >= d1 ? 1440 : minsOf(x.e), c: x.c }))
    .sort((a,b) => a.s - b.s);
}

// Plages libres dans [from, H1]
function freeGaps(evts, from) {
  const gaps = []; let cur = from;
  for (const ev of evts) {
    if (ev.e <= cur) continue;
    if (ev.s >= H1) break;
    if (ev.s - cur >= MIN_GAP) gaps.push({ s: cur, e: Math.min(ev.s, H1) });
    cur = Math.max(cur, ev.e);
  }
  if (H1 - cur >= MIN_GAP) gaps.push({ s: cur, e: H1 });
  return gaps;
}

function statusHTML(evts, isToday, nowM) {
  if (!isToday) {
    const n = evts.length;
    return n === 0
      ? '<span class="status st-free">Libre toute la journée</span>'
      : `<span class="status st-busy">${n} réservation${n>1?'s':''}</span>`;
  }
  if (nowM >= H1) return '<span class="status st-off">Journée terminée</span>';
  const cur = evts.find(ev => ev.s <= nowM && ev.e > nowM);
  if (cur) {
    // Enchaîne les réunions contiguës pour l'heure de libération réelle
    let end = cur.e;
    for (const ev of evts) if (ev.s <= end && ev.e > end) end = ev.e;
    const org = getOrg(cur.c.organizer);
    return `<span class="status st-busy">Occupée jusqu'à ${end >= 1440 ? 'ce soir' : hm(end)}</span>
            <div class="status-sub">${esc(cur.c.subject || '—')} · ${esc(org.label)}</div>`;
  }
  const next = evts.find(ev => ev.s > nowM);
  if (!next || next.s >= H1) return '<span class="status st-free">Libre jusqu\'au soir</span>';
  return `<span class="status st-free">Libre jusqu'à ${hm(next.s)}</span>
          <div class="status-sub">puis ${esc(next.c.subject || '—')}</div>`;
}

function timelineHTML(evts, isToday, nowM, roomIdx, bat) {
  let h = '<div class="tl">';
  for (let t = H0 + 60; t < H1; t += 60) h += `<div class="hl${t===12*60||t===14*60?' noon':''}" style="left:${pct(t)}"></div>`;
  if (isToday && nowM > H0) h += `<div class="past" style="width:${pct(Math.min(nowM, H1))}"></div>`;

  const from = isToday ? Math.max(H0, Math.ceil(nowM / 15) * 15) : H0;
  if (from < H1) {
    for (const g of freeGaps(evts, from)) {
      h += `<div class="gap" data-r="${roomIdx}" data-s="${g.s}" data-e="${g.e}" style="left:${pct(g.s)};width:${pct(H0 + g.e - g.s)}" title="Libre ${hm(g.s)}–${hm(g.e)} — cliquer pour réserver"><span>+</span></div>`;
    }
  }
  for (const ev of evts) {
    const s = Math.max(ev.s, H0), e = Math.min(ev.e, H1);
    if (e <= s) continue;
    const org = getOrg(ev.c.organizer);
    const tip = `${ev.c.isallday ? 'Journée' : hm(ev.s)+'–'+hm(ev.e)} · ${ev.c.subject || '—'} (${ev.c.organizer || '?'})`;
    h += `<div class="blk ${org.css}" style="left:${pct(s)};width:${pct(H0 + e - s)}" title="${esc(tip)}">${esc(org.label)}</div>`;
  }
  if (isToday && nowM >= H0 && nowM <= H1) h += `<div class="nowline" style="left:${pct(nowM)}"></div>`;
  return h + '</div>';
}

function evtsListHTML(evts, isToday, nowM) {
  if (!evts.length) return '';
  return '<div class="evts">' + evts.map(ev => {
    const org = getOrg(ev.c.organizer);
    const when = ev.c.isallday || (ev.s === 0 && ev.e === 1440) ? 'Journée' : `${hm(ev.s)}–${hm(ev.e)}`;
    const done = isToday && ev.e <= nowM ? ' done' : '';
    return `<span class="evt${done}"><b>${when}</b> ${esc(ev.c.subject || '—')}<span class="org ${org.css}">${esc(org.label)}</span></span>`;
  }).join('') + '</div>';
}

let DATA = null;
let viewOffset = null; // 0 = aujourd'hui, 1 = jour ouvré suivant

function nextWorkday(d) { const n = new Date(d); n.setHours(0,0,0,0); do { n.setDate(n.getDate()+1); } while (isWeekend(n)); return n; }
function viewDay() { const t = new Date(); t.setHours(0,0,0,0); return viewOffset === 1 ? nextWorkday(t) : t; }

function render() {
  if (!DATA) return;
  const now = new Date(), nowM = minsOf(now);
  const day = viewDay();
  const isToday = viewOffset === 0;

  // Onglets
  document.getElementById('tab0').classList.toggle('active', isToday);
  document.getElementById('tab1').classList.toggle('active', !isToday);
  document.getElementById('tab1').textContent = nextWorkday(now).toLocaleDateString('fr-FR', { weekday:'short', day:'2-digit', month:'2-digit' });
  document.getElementById('dayTitle').textContent =
    day.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' }) + (isToday && isWeekend(day) ? ' · week-end' : '');

  // Fraîcheur des données
  const stale = document.getElementById('stale');
  const m = (DATA.updated || '').match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
  if (m) {
    const upd = new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]);
    const age = (now - upd) / 60000;
    stale.style.display = age > STALE_AFTER ? '' : 'none';
    stale.textContent = `Données datant de ${Math.round(age/60) >= 1 ? Math.round(age/60) + ' h' : Math.round(age) + ' min'}`;
  }

  const byName = {};
  (DATA.salles || []).forEach(s => byName[s.nom] = s.créneaux || []);

  let ticks = '<div class="ticks">';
  for (let t = H0; t <= H1; t += 60) ticks += `<span class="tick${(t/60)%2 ? ' odd' : ''}" style="left:${pct(t)}">${t/60}h</span>`;
  ticks += '</div>';

  let html = `<div class="row head"><div>Salle</div><div class="c-st">${isToday ? 'Maintenant' : 'Synthèse'}</div><div class="c-tl">${ticks}</div></div>`;
  let lastEtage = null;
  SALLES.forEach((salle, i) => {
    if (salle.etage !== lastEtage) { html += `<div class="floor f-${salle.bat}">${salle.etage}</div>`; lastEtage = salle.etage; }
    const evts = eventsOfDay(byName[salle.nom], day);
    html += `<div class="row">
      <div><div class="room-name">${salle.nom}</div><div class="room-cap">${salle.cap}</div></div>
      <div class="c-st">${statusHTML(evts, isToday, nowM)}</div>
      <div class="c-tl">${timelineHTML(evts, isToday, nowM, i, salle.bat)}${evtsListHTML(evts, isToday, nowM)}</div>
    </div>`;
  });
  document.getElementById('board').innerHTML = html;
}

// Réservation : compositeur Outlook Web prérempli (même mécanisme que MÉTA-FLASH)
function reserver(salle, day, sMin, eMin) {
  const start = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, sMin);
  const end   = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, eMin);
  const p = new URLSearchParams({
    path:'/calendar/action/compose', rru:'addevent',
    startdt:start.toISOString(), enddt:end.toISOString(),
    subject:`Réunion — ${salle.nom}`, location:`${salle.nom} — ${salle.bat === 'aldev' ? 'Aldev 4e étage' : 'Métamorphose'}`, to:salle.email,
  });
  window.open('https://outlook.office.com/calendar/deeplink/compose?' + p.toString(), '_blank');
}

// Clic sur une plage libre : démarre à la demi-heure cliquée, durée 1h (bornée à la plage)
document.getElementById('board').addEventListener('click', e => {
  const g = e.target.closest('.gap'); if (!g) return;
  const s = +g.dataset.s, en = +g.dataset.e;
  const r = g.getBoundingClientRect();
  const clicked = s + (e.clientX - r.left) / r.width * (en - s);
  let start = Math.max(s, Math.floor(clicked / 30) * 30);
  if (en - start < 30) start = Math.max(s, en - 30);
  reserver(SALLES[+g.dataset.r], viewDay(), start, Math.min(start + 60, en));
});

document.getElementById('tab0').onclick = () => { viewOffset = 0; render(); };
document.getElementById('tab1').onclick = () => { viewOffset = 1; render(); };

const get = f => fetch(f + '?t=' + Date.now()).then(r => { if (!r.ok) throw new Error(f + ' introuvable'); return r.json(); });
Promise.all([get('data.json'), get('data-aldev.json')])
  .then(([meta, aldev]) => {
    // Fusion : on ne garde de data-aldev.json que les salles listées (Bull, Scania)
    const keep = new Set(SALLES.filter(s => s.bat === 'aldev').map(s => s.nom));
    const data = { updated: meta.updated, salles: [...(meta.salles || []), ...(aldev.salles || []).filter(s => keep.has(s.nom))] };
    DATA = data;
    document.getElementById('updated').textContent = data.updated || '—';
    // Par défaut : jour suivant si journée terminée ou week-end
    const now = new Date();
    viewOffset = (minsOf(now) >= H1 || isWeekend(now)) ? 1 : 0;
    render();
    setInterval(render, 60000); // trait "maintenant" et statuts à jour chaque minute
  })
  .catch(err => { document.getElementById('board').innerHTML = `<div class="msg">${esc(err.message)}</div>`; });
</script>
</body>
</html>
